# ─── Course Schedule Data ───
# Edit this file to update the schedule. The schedule.qmd reads it automatically.
#
# Fields per week:
#   week:       Week number (use "—" for breaks)
#   date:       Date string
#   topic:      Topic title
#   icon:       Font Awesome icon name (without "fa-solid fa-" prefix)
#   section:    (optional) Section divider label — only on first week of each part
#   content:    (optional) Reading link URL; set to "#" as placeholder
#   content_title: (optional) Tooltip for reading icon
#   class:      (optional) Slides/class link URL; set to "#" as placeholder
#   class_title:   (optional) Tooltip for class icon
#   assign:     (optional) Assignment link URL; set to "#" as placeholder
#   assign_title:  (optional) Tooltip for assignment icon
#   milestone:  (optional) true if assignment is a major milestone (gets highlighted)
#   break:      (optional) true for holiday/no-class weeks

